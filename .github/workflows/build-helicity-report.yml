name: Build helicity density-matrix report

on:
  workflow_dispatch:
  push:
    paths:
      - 'helicity_density_matrix_report.tex'
      - 'analysis/generate_helicity_report_assets.py'
      - 'analysis/check_helicity_report.py'
      - 'reports/helicity_demo_*.tex'
      - 'reports/helicity_report_assets.json'
      - 'figs/helicity_density_matrix_*.png'
      - 'data/helicity_density_matrix_demo.npz'
      - 'reports/helicity_density_matrix_validation.json'
      - '.github/workflows/build-helicity-report.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: helicity_density_matrix_report.tex
          latexmk_use_lualatex: false
      - name: Inspect PDF
        run: |
          test -s helicity_density_matrix_report.pdf
          pdfinfo helicity_density_matrix_report.pdf
          pdftotext helicity_density_matrix_report.pdf helicity_density_matrix_report.txt
          grep -q "Conditional spin and helicity" helicity_density_matrix_report.txt
          grep -q "Dense coding with SOC" helicity_density_matrix_report.txt
          grep -q "Reproducibility" helicity_density_matrix_report.txt
          if grep -q '\[\[??\]\]' helicity_density_matrix_report.txt; then
            echo 'Unresolved LaTeX references in PDF' >&2
            exit 1
          fi
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: helicity-density-matrix-report
          path: helicity_density_matrix_report.pdf
          retention-days: 90
      - name: Commit compiled PDF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add helicity_density_matrix_report.pdf
          git diff --cached --quiet || {
            git commit -m 'Build helicity density-matrix PDF report'
            git push origin "${GITHUB_REF_NAME}"
          }
