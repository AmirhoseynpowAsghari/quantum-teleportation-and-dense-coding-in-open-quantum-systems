name: Build helicity density-matrix report

on:
  workflow_dispatch:
  push:
    paths:
      - 'helicity_density_matrix_report.tex'
      - 'analysis/generate_helicity_report_assets.py'
      - 'analysis/check_helicity_report.py'
      - 'reports/helicity_demo_*.tex'
      - 'reports/helicity_report_assets.json'
      - 'figs/helicity_density_matrix_*.png'
      - 'data/helicity_density_matrix_demo.npz'
      - 'reports/helicity_density_matrix_validation.json'
      - '.github/workflows/build-helicity-report.yml'

permissions:
  contents: write

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile helicity report with TeX Live
        uses: xu-cheng/latex-action@v4
        with:
          root_file: helicity_density_matrix_report.tex
          args: -pdf -interaction=nonstopmode -halt-on-error helicity_density_matrix_report.tex

      - name: Prepare LaTeX log
        if: always()
        run: |
          mkdir -p reports
          if [ -f helicity_density_matrix_report.log ]; then
            cp helicity_density_matrix_report.log reports/helicity_density_matrix_report.log
          fi

      - name: Commit compiled files through the GitHub Contents API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          for path in ("helicity_density_matrix_report.pdf", "reports/helicity_density_matrix_report.log"):
              if not os.path.isfile(path):
                  continue
              endpoint = f"https://api.github.com/repos/{repository}/contents/{path}"
              query = urllib.parse.urlencode({"ref": branch})
              sha = None
              try:
                  with urllib.request.urlopen(urllib.request.Request(
                          endpoint + "?" + query, headers=headers)) as response:
                      sha = json.load(response).get("sha")
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              payload = {
                  "message": f"Build {os.path.basename(path)} [skip ci]",
                  "branch": branch,
                  "content": base64.b64encode(open(path, "rb").read()).decode("ascii"),
              }
              if sha:
                  payload["sha"] = sha
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={**headers, "Content-Type": "application/json"},
                  method="PUT",
              )
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
              print(f"Committed {path}: {result['commit']['sha']}")
          PY

      - name: Upload helicity report PDF
        uses: actions/upload-artifact@v4
        with:
          name: helicity-density-matrix-report
          path: helicity_density_matrix_report.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Upload LaTeX log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helicity-report-latex-log
          path: helicity_density_matrix_report.log
          if-no-files-found: ignore
          retention-days: 30
