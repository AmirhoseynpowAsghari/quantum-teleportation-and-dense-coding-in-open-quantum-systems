name: Build manuscript PDF

on:
  workflow_dispatch:
  push:
    paths:
      - manuscript.tex
      - .github/workflows/build-manuscript.yml

permissions:
  contents: write

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile manuscript with TeX Live
        uses: xu-cheng/latex-action@v4
        with:
          root_file: manuscript.tex
          args: -pdf -interaction=nonstopmode -halt-on-error manuscript.tex

      - name: Commit compiled PDF and log to the triggering branch
        run: |
          mkdir -p reports
          cp manuscript.log reports/manuscript.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript.pdf reports/manuscript.log
          if git diff --cached --quiet; then
            echo "Compiled outputs are unchanged."
          else
            git commit -m "Build manuscript PDF [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: manuscript.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload LaTeX log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manuscript-latex-log
          path: manuscript.log
          if-no-files-found: ignore
          retention-days: 30
